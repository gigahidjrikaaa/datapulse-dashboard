<svg xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 740 400">
  <!-- checklist card -->
  <g fill="none" stroke="#5A3921" stroke-width="9">
    <rect x="70" y="60" width="250" height="290" rx="14" fill="#FFFFFF"/>
    <path d="M 108 128 h 60 M 108 200 h 60 M 108 272 h 60" stroke="#E2DCD2" stroke-width="14"/>
  </g>
  <g fill="none" stroke="#A22727" stroke-width="9">
    <path d="M 190 122 l 14 14 l 26 -28"/>
    <path d="M 190 194 l 14 14 l 26 -28"/>
    <path d="M 190 266 l 14 14 l 26 -28"/>
  </g>
  <!-- gavel: head + handle as one rotated unit -->
  <g transform="rotate(-40 520 240)">
    <rect x="452" y="196" width="18" height="88" rx="7" fill="#322014" stroke="none"/>
    <rect x="570" y="196" width="18" height="88" rx="7" fill="#322014" stroke="none"/>
    <rect x="466" y="206" width="108" height="68" rx="14" fill="#5A3921" stroke="#322014" stroke-width="8"/>
    <path d="M 520 274 L 520 366" stroke="#322014" stroke-width="15"/>
  </g>
  <!-- strike pedestal -->
  <g fill="none" stroke="#5A3921" stroke-width="10">
    <path d="M 386 322 h 96 l 12 20 h -120 Z" fill="#E2DCD2"/>
    <path d="M 368 342 H 512" stroke-width="12"/>
  </g>
  <!-- impact sparks -->
  <g stroke="#A22727" stroke-width="8" fill="none">
    <path d="M 372 232 l -24 -10 M 380 268 l -26 4"/>
  </g>
</svg>