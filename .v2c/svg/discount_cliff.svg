<svg xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 740 300">
  <!-- zero baseline -->
  <path d="M 56 250 H 700" stroke="#8A7B6B" stroke-width="7" opacity="0.6"/>
  <g fill="none" stroke="#5A3921" stroke-width="10">
    <!-- healthy bars sliding down -->
    <path d="M 90 250 V 130" stroke="#E2DCD2" stroke-width="42"/>
    <path d="M 190 250 V 168" stroke="#E2DCD2" stroke-width="42"/>
    <path d="M 290 250 V 206" stroke="#E2DCD2" stroke-width="42"/>
  </g>
  <!-- the 20% line -->
  <path d="M 350 40 V 262" stroke="#A22727" stroke-width="8" stroke-dasharray="14 14"/>
  <!-- loss bars falling -->
  <g fill="none" stroke="#A22727" stroke-width="10">
    <path d="M 420 250 V 296" stroke-width="0"/>
    <path d="M 430 250 l 0 34" stroke="#A22727" stroke-width="26"/>
    <path d="M 530 250 l 0 44" stroke="#A22727" stroke-width="26"/>
    <path d="M 630 250 l 0 30" stroke="#A22727" stroke-width="26"/>
  </g>
  <!-- trend arrow diving over the cliff -->
  <path d="M 120 96 C 260 84 420 110 560 196 L 640 236" fill="none" stroke="#322014" stroke-width="11"/>
  <path d="M 596 232 L 648 240 L 630 190" fill="none" stroke="#322014" stroke-width="11"/>
  <!-- % glyph on the tallest healthy bar -->
  <text x="90" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold"
        fill="#5A3921" stroke="none" text-anchor="middle">%</text>
</svg>