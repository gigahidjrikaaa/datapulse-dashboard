<!DOCTYPE html>
<html><head><style>
  html,body{margin:0;padding:0;background:transparent}
  svg{display:block;width:1400px;height:440px}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <!-- Syndicate 6 logo: hexagon badge (six sides = Syndicate 6) + wordmark -->
  <!-- hexagon badge, pointy-top, centre (110,110), R=88 -->
  <polygon points="110,22 186.2,66 186.2,154 110,198 33.8,154 33.8,66"
           fill="none" stroke="#322014" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="110,44 167.4,77 167.4,143 110,176 52.6,143 52.6,77"
           fill="none" stroke="#C5A681" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <!-- monogram -->
  <text x="110" y="142" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="bold"><tspan fill="#322014">S</tspan><tspan fill="#A22727">6</tspan></text>
  <!-- rising bars at the hexagon base -->
  <rect x="90" y="168" width="9" height="12" fill="#C5A681"/>
  <rect x="104" y="161" width="9" height="19" fill="#C5A681"/>
  <rect x="118" y="153" width="9" height="27" fill="#A22727"/>
  <!-- wordmark -->
  <text x="232" y="102" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold"
        letter-spacing="13" fill="#322014">SYNDICATE</text>
  <line x1="234" y1="124" x2="662" y2="124" stroke="#C5A681" stroke-width="3"/>
  <line x1="234" y1="124" x2="320" y2="124" stroke="#A22727" stroke-width="3"/>
  <text x="234" y="164" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold"
        letter-spacing="9" fill="#8A7B6B">ANALYTICS TASKFORCE</text>
</svg>

</body></html>
